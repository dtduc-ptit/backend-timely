version: "3.9"

services:
  backend:
    container_name: timely_app_backend
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    networks:
      - timely_app_db_network

networks:
  timely_app_db_network:
    external: true
